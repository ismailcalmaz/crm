<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İletişim — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch">
    <div class="p-lg md:p-xl max-w-[1536px] mx-auto w-full space-y-lg">

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-md">
        <div>
          <h2 class="text-headline-md text-primary">Mesaj Merkezi</h2>
          <p class="text-body-md text-on-surface-variant">Web sitesi iletişim/geri arama talepleri. Yanıtla, ata, sonuçlandır.</p>
        </div>
        <button id="yenile" class="bg-surface-container-low border border-outline-variant text-on-surface px-4 py-2 rounded-lg text-label-md font-bold flex items-center gap-2 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">refresh</span> Yenile</button>
      </div>

      <div id="kpi" class="grid grid-cols-2 lg:grid-cols-4 gap-gutter"></div>

      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div id="filtreler" class="flex flex-wrap items-center gap-sm"></div>
        <div class="relative flex-1 min-w-[200px] max-w-xs">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
          <input id="iletiAra" placeholder="Kişi, konu veya mesaj ara…" class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-9 pr-3 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30" />
        </div>
      </div>

      <div class="flex gap-gutter items-start">
        <div class="w-full xl:w-[380px] shrink-0 bg-surface-container-lowest rounded-2xl border border-outline-variant custom-shadow overflow-hidden">
          <div id="liste" class="overflow-auto divide-y divide-outline-variant/40" style="max-height:calc(100vh - 300px)"></div>
        </div>
        <section id="iletiDetay" class="hidden xl:flex flex-1 min-w-0 flex-col bg-surface-container-lowest rounded-2xl border border-outline-variant custom-shadow overflow-hidden self-stretch" style="max-height:calc(100vh - 300px)"></section>
      </div>

    </div>
    <div id="iletiDetayKatman" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
    <div id="iletiToast" class="hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[60] bg-on-surface text-white rounded-full px-5 py-3 flex items-center gap-2 shadow-2xl text-label-md font-bold"></div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { webIletisimKur } from './js/web-iletisim.js'
    const d = await requireAuth({ sayfa: 'web_iletisim' })
    if (d) { ustBarKur(d); await webIletisimKur() }
  </script>
</body>
</html>
