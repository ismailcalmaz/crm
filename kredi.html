<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kredi Kuyruğu — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch" id="icerik">
    <div class="p-lg md:p-xl max-w-[1536px] mx-auto w-full space-y-lg">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-md">
        <div>
          <h2 class="text-headline-md text-primary">Kredi Operasyon Merkezi</h2>
          <p class="text-body-md text-on-surface-variant">Soldan dosya seç, sağda yönet — sayfa değişmez. Çipe dokunulmayan kurum "başvurulmadı" sayılır.</p>
        </div>
        <button id="yenile" class="bg-surface-container-low border border-outline-variant px-4 py-2 rounded-lg text-label-md font-bold inline-flex items-center gap-2 hover:bg-surface-container">
          <span class="material-symbols-outlined text-[18px]">refresh</span> Yenile
        </button>
      </div>

      <!-- Görev sayaçları -->
      <section id="krediKpi" class="grid grid-cols-2 lg:grid-cols-4 gap-gutter"></section>

      <!-- Kontrol: arama + arşiv -->
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="relative flex-1 min-w-[220px] max-w-md">
          <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-[18px]">search</span>
          <input id="krediArama" placeholder="Müşteri adı, telefon veya plaka ara…" class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-9 pr-3 py-2 text-body-md focus:outline-none focus:ring-2 focus:ring-primary/30" />
        </div>
        <label class="flex items-center gap-2 text-label-md text-on-surface-variant cursor-pointer">
          <input type="checkbox" id="arsivChk" class="w-4 h-4 accent-[#5f1818]" /> Sonlandırılmışları da göster
        </label>
      </div>
      <div id="krediFiltreler" class="flex flex-wrap items-center gap-sm"></div>

      <!-- Split: dosya kuyruğu + çalışma alanı -->
      <div class="flex gap-gutter items-start">
        <div class="w-full xl:w-[360px] shrink-0 bg-surface-container-lowest rounded-2xl border border-outline-variant custom-shadow overflow-hidden">
          <div class="px-lg py-3 border-b border-outline-variant flex items-center justify-between">
            <h3 class="text-title-lg text-primary flex items-center gap-2"><span class="material-symbols-outlined">inbox</span> Dosya Kuyruğu</h3>
            <span id="kuyrukSayac" class="text-label-sm text-on-surface-variant"></span>
          </div>
          <div id="kuyrukListe" class="overflow-auto p-2.5 space-y-2" style="max-height:calc(100vh - 320px)"></div>
        </div>
        <section id="dosyaCalisma" class="hidden xl:flex flex-1 min-w-0 flex-col bg-surface-container-lowest rounded-2xl border border-outline-variant custom-shadow overflow-hidden self-stretch" style="max-height:calc(100vh - 320px)"></section>
      </div>

    </div>
    <div id="dosyaKatman" class="fixed inset-0 bg-black/40 z-40 hidden"></div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { krediKur } from './js/kredi.js'
    const d = await requireAuth({ sayfa: 'kredi' })
    if (d) { ustBarKur(d); await krediKur(d) }
  </script>
</body>
</html>
