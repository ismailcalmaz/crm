<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yayın Merkezi — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch">
    <div class="p-lg md:p-xl max-w-[1536px] mx-auto w-full space-y-lg">

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-md">
        <div>
          <h2 class="text-headline-md text-primary">Yayın Merkezi</h2>
          <p class="text-body-md text-on-surface-variant">
            Tüm kanallar tek yerden — sahibinden.com (manuel) · ismailcalmaz.com ve arabam.com (otomatik).
            <span id="sayac" class="font-bold text-on-surface"></span>
          </p>
        </div>
        <button id="yenile" class="bg-surface-container-low border border-outline-variant text-on-surface px-4 py-2 rounded-lg text-label-md font-bold flex items-center gap-2 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">refresh</span> Yenile</button>
      </div>

      <!-- Kanal filtresi -->
      <div id="kanallar"></div>

      <!-- KPI kartları -->
      <div id="kpi" class="grid grid-cols-2 lg:grid-cols-4 gap-gutter"></div>

      <!-- Kanala göre içerik -->
      <div id="icerik"></div>

    </div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { yayinMerkeziKur } from './js/yayin-merkezi.js'
    const d = await requireAuth({ sayfa: 'yayin_merkezi' })
    if (d) { ustBarKur(d); await yayinMerkeziKur(d) }
  </script>
</body>
</html>
