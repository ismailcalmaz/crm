<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sigorta Fırsatları — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch">
    <div class="p-lg md:p-xl max-w-[1536px] mx-auto w-full space-y-lg">

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-md">
        <div>
          <h2 class="text-headline-md text-primary flex items-center gap-2"><span class="material-symbols-outlined">handshake</span> Sigorta Fırsatları</h2>
          <p id="frOzet" class="text-body-md text-on-surface-variant">Peşin satışlarda sigorta teklifi takibi.</p>
        </div>
        <div class="flex items-center gap-2">
          <select id="frDanismanF" class="bg-surface border border-outline-variant rounded-lg px-3 py-2 text-body-md hidden"><option value="">Tüm Danışmanlar</option></select>
          <button id="frYeni" class="bg-primary text-on-primary pl-3 pr-4 h-10 flex items-center gap-1.5 rounded-lg text-label-md font-bold hover:opacity-90 shadow-sm shadow-primary/20"><span class="material-symbols-outlined text-[20px]">add</span> Yeni Fırsat</button>
        </div>
      </div>

      <div id="frKpi" class="grid grid-cols-2 lg:grid-cols-4 gap-gutter"></div>

      <!-- Ön kayıtlar (bilgi işlem / master) -->
      <section id="frOnKayit" class="hidden"></section>

      <!-- Kanban -->
      <div id="frKanban" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-gutter items-start"></div>

    </div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { firsatKur } from './js/sigorta-firsat.js'
    const d = await requireAuth({ sayfa: 'sigorta_firsat' })
    if (d) { ustBarKur(d); await firsatKur(d) }
  </script>
</body>
</html>
