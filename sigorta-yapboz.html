<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yapbozlar — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch">
    <div class="p-lg md:p-xl max-w-[1536px] mx-auto w-full space-y-lg">

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-md">
        <div>
          <h2 class="text-headline-md text-primary flex items-center gap-2"><span class="material-symbols-outlined">extension</span> Yapbozlar</h2>
          <p id="ypOzet" class="text-body-md text-on-surface-variant">Kısa dönem trafik sigortaları — takip ve iade merkezi.</p>
        </div>
        <div class="flex items-center gap-2">
          <button id="ypYeni" class="bg-primary text-on-primary pl-3 pr-4 h-10 flex items-center gap-1.5 rounded-lg text-label-md font-bold hover:opacity-90 shadow-sm shadow-primary/20"><span class="material-symbols-outlined text-[20px]">add</span> Yeni Yapboz</button>
        </div>
      </div>

      <!-- KPI -->
      <div id="ypKpi" class="grid grid-cols-2 lg:grid-cols-4 gap-gutter"></div>

      <!-- Filtreler -->
      <div class="flex flex-col lg:flex-row lg:items-center gap-3">
        <div id="ypSekmeler" class="flex flex-wrap gap-2"></div>
        <div class="flex items-center gap-2 lg:ml-auto">
          <select id="ypSirketF" class="bg-surface border border-outline-variant rounded-lg px-3 py-2 text-body-md"><option value="">Tüm şirketler</option></select>
          <div class="flex items-center bg-surface border border-outline-variant rounded-lg px-3 py-2">
            <span class="material-symbols-outlined text-on-surface-variant text-[20px]">search</span>
            <input id="ypPlakaF" placeholder="Plaka ara…" class="bg-transparent outline-none text-body-md ml-2 w-32" />
          </div>
        </div>
      </div>

      <!-- Tablo -->
      <div id="ypListe"></div>

    </div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { yapbozKur } from './js/sigorta-yapboz.js'
    const d = await requireAuth({ sayfa: 'sigorta_yapboz' })
    if (d) { ustBarKur(d); await yapbozKur(d) }
  </script>
</body>
</html>
