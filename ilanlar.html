<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>İlanlarımız — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch">
    <div class="p-lg md:p-xl max-w-[1536px] mx-auto w-full space-y-lg">

      <div class="flex flex-col md:flex-row md:items-center justify-between gap-md">
        <div>
          <h2 class="text-headline-md text-primary">İlanlarımız</h2>
          <p class="text-body-md text-on-surface-variant">
            İlan Operasyon Merkezi — yayın, yenileme, adil dağıtım ve fiyat senkronu.
            <span id="sayac" class="font-bold text-on-surface"></span>
          </p>
        </div>
        <div class="flex items-center gap-2">
          <!-- Arama kutusu #icerik'in DIŞINDA: her tuşta yalnız içerik yeniden
               çizilir, kutu yerinde kaldığı için odak ve imleç korunur. -->
          <div class="relative">
            <span class="material-symbols-outlined text-[18px] absolute left-2.5 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">search</span>
            <input id="ara" type="search" autocomplete="off" placeholder="Plaka, marka, danışman, ilan no…"
              class="w-full sm:w-72 border border-outline-variant rounded-lg pl-9 pr-8 py-2 text-body-md bg-white focus:border-primary focus:ring-1 focus:ring-primary" />
            <button id="aramaTemizle" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-on-surface" title="Aramayı temizle">
              <span class="material-symbols-outlined text-[18px]">close</span></button>
          </div>
          <button id="yenile" class="bg-surface-container-low border border-outline-variant text-on-surface px-4 py-2 rounded-lg text-label-md font-bold flex items-center gap-2 hover:bg-surface-container transition-colors shrink-0"><span class="material-symbols-outlined text-[18px]">refresh</span> Yenile</button>
        </div>
      </div>

      <!-- KPI kartları -->
      <div id="kpi" class="grid grid-cols-2 lg:grid-cols-3 xl:grid-cols-6 gap-gutter"></div>

      <!-- Sekmeler -->
      <div id="sekmeler"></div>

      <div id="icerik"></div>

    </div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { ilanlarKur } from './js/ilanlar.js'
    const d = await requireAuth({ sayfa: 'ilanlar' })
    if (d) { ustBarKur(d); await ilanlarKur(d) }
  </script>
</body>
</html>
