<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Talep Detayı — CRM</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="topbar"></header>
  <nav class="nav" id="nav"></nav>

  <main class="icerik stitch" id="icerik">
    <div class="p-lg md:p-xl max-w-[1440px] mx-auto w-full space-y-lg">

      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-md">
        <div class="flex items-center gap-3">
          <a href="talepler.html" class="text-on-surface-variant hover:text-primary shrink-0" title="Talepler"><span class="material-symbols-outlined">arrow_back</span></a>
          <div>
            <h2 id="talepBaslik" class="text-headline-md text-primary">Talep Detayı</h2>
            <p class="text-body-md text-on-surface-variant">Talep bilgileri, notlar ve ekip sohbeti.</p>
          </div>
        </div>
        <a id="musteriKartiLink" href="#" style="display:none" class="bg-surface-container-low border border-outline-variant px-4 py-2 rounded-lg text-label-md font-bold items-center gap-2 hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-[18px]">person</span> Müşteri Kartı</a>
      </div>

      <div id="mukerrerUyari"></div>

      <section class="bg-surface-container-lowest rounded-xl border border-outline-variant custom-shadow p-lg">
        <h3 class="text-title-lg text-primary mb-4 flex items-center gap-2"><span class="material-symbols-outlined">description</span> Talep Bilgileri</h3>
        <div id="talepOzet"></div>
      </section>

      <section id="uygunStokKart" class="bg-surface-container-lowest rounded-xl border border-outline-variant custom-shadow overflow-hidden" style="display:none">
        <div class="p-lg border-b border-outline-variant flex justify-between items-center">
          <h3 class="text-title-lg text-primary flex items-center gap-2"><span class="material-symbols-outlined">directions_car</span> Uygun Stok Araçları</h3>
          <span id="uygunStokSayi" class="text-label-sm text-on-surface-variant"></span>
        </div>
        <div id="uygunStok" class="overflow-x-auto"></div>
      </section>

      <section class="bg-surface-container-lowest rounded-xl border border-outline-variant custom-shadow p-lg">
        <h3 class="text-title-lg text-primary mb-4 flex items-center gap-2"><span class="material-symbols-outlined">account_balance</span> Katılım Finans</h3>
        <div id="finansKutu"></div>
      </section>

      <section class="bg-surface-container-lowest rounded-xl border border-outline-variant custom-shadow p-lg">
        <h3 class="text-title-lg text-primary mb-4 flex items-center gap-2"><span class="material-symbols-outlined">handshake</span> Satış</h3>
        <div id="satisKutu"></div>
      </section>

      <div class="flex items-center justify-between">
        <h3 class="text-title-lg text-primary flex items-center gap-2"><span class="material-symbols-outlined">forum</span> Görüşme Notları</h3>
        <button id="yeniNotBtn" class="bg-primary text-on-primary px-lg py-sm rounded-lg text-label-md font-bold flex items-center gap-2 hover:opacity-90 transition-all"><span class="material-symbols-outlined text-[18px]">add</span> Not Ekle</button>
      </div>

      <div id="yeniNotKart" class="bg-surface-container-lowest rounded-xl border border-outline-variant custom-shadow p-lg gizli">
        <form id="yeniNotForm">
          <div class="form-satir">
            <div class="alan"><label>Müşteri Durumu (bu notla güncellenir)</label><select id="yeniNotDurum"></select></div>
            <div class="alan" id="yeniNotKayipAlan" style="display:none"><label>Kayıp Nedeni</label><select id="yeniNotKayip"></select></div>
          </div>
          <div id="yeniNotCipler" class="flex flex-wrap gap-2 mb-2"></div>
          <div class="alan tam"><label>Görüşme Notu</label><textarea id="yeniNotMetin" placeholder="Ne konuşuldu? (yukarıdan hızlı seçim de kullanabilirsin)"></textarea></div>
          <div class="form-satir">
            <div class="alan"><label>Sonraki Arama / Aksiyon Tarihi (opsiyonel)</label><input type="date" id="yeniNotSonraki" /></div>
            <div class="alan"></div>
          </div>
          <div class="aralik"><label style="display:inline-flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="yeniNotHavuza" /> Havuza bırak (sahipsiz)</label></div>
          <div class="aralik"><button type="submit" class="bg-primary text-on-primary px-lg py-sm rounded-lg text-label-md font-bold inline-flex items-center gap-2 hover:opacity-90 transition-all"><span class="material-symbols-outlined text-[18px]">add</span> Not Ekle</button></div>
        </form>
      </div>

      <div id="notlar" class="space-y-4"></div>

    </div>
  </main>

  <script type="module">
    import { requireAuth, ustBarKur } from './js/auth.js'
    import { talepKur } from './js/talep.js'
    const d = await requireAuth({ sayfa: 'talepler' })
    if (d) { ustBarKur(d); await talepKur(d) }
  </script>
</body>
</html>
